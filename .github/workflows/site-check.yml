name: Site checks

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install site dependencies
        run: npm ci
      - name: Install theme build dependencies
        run: npm ci --prefix themes/journal
      - name: Generate and validate site
        run: npm run build
      - name: Report media quality
        run: npm run report:media
      - name: Report content quality
        run: npm run report:content
